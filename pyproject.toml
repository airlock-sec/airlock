[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlock"
version = "0.0.1"
description = "Scan Stellar and Soroban repositories for supply-chain compromise and release-integrity gaps."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "airlock-sec" }]
keywords = ["security", "supply-chain", "stellar", "soroban", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
airlock = "airlock.cli:main"

[project.urls]
Repository = "https://github.com/airlock-sec/airlock"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff format also rewrites Python fences inside Markdown. The design documents are prose
# the roadmap rules require to stay reviewable, so they are out of scope for the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
