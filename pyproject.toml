[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlock"
version = "0.0.1"
description = "Scan Stellar and Soroban repositories for supply-chain compromise and release-integrity gaps."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "airlock-sec" }]
keywords = ["security", "supply-chain", "stellar", "soroban", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
airlock = "airlock.cli:main"

[project.urls]
Repository = "https://github.com/airlock-sec/airlock"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

# The scanner reads its rules at start-up, so a wheel without `rules/` cannot scan at all: it
# fails with a missing-file error and exits 2 (5.7). The data is bundled inside the package and
# `cli.rules_root` prefers that copy when it is there.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "airlock/rules"

[dependency-groups]
# hatchling is the build backend, listed here so CI can build the wheel with
# `--no-build-isolation` from the same hash-pinned lock as the test tools (1.18).
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "mypy>=2.4.0", "hatchling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` is the package under test; `.` lets the suite import its own fixture builders.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff format also rewrites Python fences inside Markdown. The design documents are prose
# the roadmap rules require to stay reviewable, so they are out of scope for the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
