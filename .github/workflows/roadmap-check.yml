# The roadmap gate (tasks 1.9 and 1.15): a pull request that changes files must add a record under
# `docs/changes/` and regenerate `ROADMAP.md` from the records, and the generated regions must still
# describe their sources.
#
# Making this a required check is repository settings, not a file (1.3, 0.13), and until it is
# required a PR can still merge with a stale roadmap. What this workflow does guarantee is that
# the staleness is visible on the PR.

name: Roadmap gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate diffs the branch against its base, so it needs both ends of that history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: The change is recorded under docs/changes and regenerated into ROADMAP.md
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh scripts/check_roadmap_touched.sh "origin/${BASE_REF}"

      - name: The generated regions match their sources
        run: python scripts/roadmap_progress.py --check
