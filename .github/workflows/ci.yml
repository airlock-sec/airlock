# Tests, lint, types and the self-scan (task 1.5).
#
# Both actions are pinned by commit SHA, with the tag that SHA was resolved from in the comment.
# A SHA pin is only honest if somebody reads the diff before moving it, and the SHA in a comment
# is the only way to know what was reviewed (AGENTS.md 9). The dev tools and the build backend
# are hash-pinned in requirements-ci.txt and installed with --require-hashes (1.18), so the pip
# command is pinned by hash as well. The lock is generated from the `dev` group in pyproject.toml
# with the command in its header; Dependabot keeps the bounds there current, and the lock is
# regenerated when those bounds move. Nothing here installs a runtime dependency, because the
# tool has none.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull_request checkout is detached at the merge ref with no base branch, and
          # `test_this_branch_passes_the_gate_it_is_adding` runs the roadmap gate against it.
          # Without the history the gate has nothing to compare against and the suite reports
          # a configuration problem as if the code were wrong.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Three steps because Scorecard reads every `pip install` in a workflow: the tools install
      # uses a requirements file that carries a hash per wheel, and the project installs from a
      # wheel this job just built, which Scorecard treats as pinned. `--no-build-isolation` uses
      # the hashed hatchling instead of letting pip fetch a build backend at install time.
      - name: Install the hash-pinned tools and build backend
        run: |
          python -m pip install --quiet --require-hashes -r requirements-ci.txt

      - name: Build the wheel
        run: |
          python -m pip wheel --quiet --no-build-isolation --no-deps --wheel-dir dist .

      - name: Install the wheel
        run: |
          python -m pip install --quiet --no-deps dist/*.whl

      - name: Tests
        run: python -m pytest

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src

      # The installed console script is the same one a consumer gets, so this step is also the
      # check that the wheel carries its rule data (5.7). It must exit 0: a HIGH finding in this
      # repository's own tree fails the build rather than the scan.
      - name: Self-scan
        run: airlock scan --mode full .
